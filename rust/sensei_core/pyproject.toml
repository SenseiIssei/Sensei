[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sensei_core"
# Taken from Cargo.toml, which the release process bumps. It was a fixed 0.1.0
# here, so every release shipped a wheel pip considered already installed.
dynamic = ["version"]
description = "Optional Rust accelerator for Sensei compression."
# Matches the abi3-py311 feature in Cargo.toml.
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
]

[tool.maturin]
features = ["pyo3/extension-module"]
