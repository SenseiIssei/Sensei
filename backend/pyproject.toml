[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensei"
version = "0.1.0"
description = "Self-hosted AI workspace that compresses prompts before they leave your machine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Sensei Issei"}]
keywords = ["ai", "llm", "glm", "self-hosted", "token-compression", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.140.2",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "email-validator>=2.3.0",
    "httpx>=0.28.1",
    "websockets>=16.1.1",
    "tiktoken>=0.13.0",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
    "cryptography>=49.0.0",
    "h2>=4.4.0",
    "pypdf>=6.14.2",
]

[project.optional-dependencies]
local = [
    "llama-cpp-python>=0.3.34",
    "vllm>=0.26.0",
]
ml = [
    "torch>=2.13.0",
    "transformers>=5.14.1",
]
gui = [
    "PySide6>=6.11.1",
]
cli = [
    "rich>=15.0.0",
]
mcp = [
    "mcp>=2.0.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.16.1",
]
all = ["sensei[local,ml,gui,cli,mcp,dev]"]

[project.scripts]
sensei = "sensei.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
sensei = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly: relying on ruff's defaults means a new ruff release can add
# rules and break CI on an unrelated PR.
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "SIM",    # simplify
    "PIE",    # misc lints
    "RUF",    # ruff-specific
    "S",      # bandit (security)
    "ASYNC",  # async correctness
    "PL",     # pylint subset
]
ignore = [
    "E501",    # line length is enforced by the formatter
    "PLR0911", # allow many returns — provider dispatch is naturally branchy
    "PLR0912", # allow many branches — same
    "PLR0913", # allow many arguments — FastAPI handlers take many
    "PLR0915", # allow long functions — compression passes are linear pipelines
    "PLR0917", # allow many positional arguments — same
    "PLR2004", # magic values are fine in compression heuristics
    "BLE001",  # broad excepts are deliberate: a self-hosted server must degrade,
               # not crash. Every one of them logs. S110 still forbids silent pass.
    "PLC0415", # imports inside functions are deliberate: every optional dependency
               # (PySide6, torch, sensei_core, cryptography) is imported lazily so a
               # minimal install still runs.
    "PLW0603", # module-level singletons are wired via `global` in init_*_deps().
    "UP042",   # `class X(str, Enum)` is deliberate — switching to StrEnum changes
               # what str(X.member) returns, which would alter API payloads.
]

[tool.ruff.lint.per-file-ignores]
# `Depends()` / `Query()` in argument defaults is the FastAPI idiom, not a bug.
"sensei/routers/*.py" = ["B008"]
# Routers are imported at the bottom of main.py, after `app` exists.
"sensei/main.py" = ["E402"]
# Tests may assert, use fixtures with shadowing names, and hardcode credentials.
"tests/*.py" = ["S101", "S104", "S105", "S106", "S311", "ASYNC230"]
"benchmarks/*.py" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Surface our own deprecations as failures; keep third-party noise visible.
    "error::DeprecationWarning:sensei.*",
]

[tool.coverage.run]
source = ["sensei"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
