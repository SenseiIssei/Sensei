<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">How Sensei sits between your tool and the model</title>
<desc id="d">Your AI tool sends about 50,000 tokens to Sensei on your machine; Sensei sends about 10,000 to the model; the answer comes back unchanged.</desc>
<style>
  .card { fill: #ffffff; stroke: #e0e2ea; }
  .mid { fill: #eff1f5; stroke: #4357dc; stroke-width: 1.5; }
  .h { font: 600 19px Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #161a25; }
  .s { font: 400 14px Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #5f6478; }
  .n { font: 700 15px 'JetBrains Mono', 'Cascadia Mono', ui-monospace, Menlo, Consolas, monospace; }
  .pkt { fill: #4d62e5; }
  .in { animation: goIn 2.75s linear infinite; }
  .out { animation: goOut 2.75s linear infinite; fill: #ffd47d; }
  .back { stroke: #8a8fa0; stroke-width: 2; stroke-dasharray: 6 8; fill: none; animation: dash 1.4s linear infinite; }
  .pulse { animation: pulse 2.75s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes goIn { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(330px); opacity: 1; } }
  @keyframes goOut { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(240px); opacity: 1; } }
  @keyframes dash { to { stroke-dashoffset: 28; } }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
<rect width="1200" height="320" rx="20" fill="#f6f7f9"/>
<rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#e0e2ea"/>

<rect class="card" x="40" y="70" width="250" height="140" rx="14"/>
<text x="64" y="112" class="h">Your AI tool</text>
<text x="64" y="138" class="s">Claude Code · Codex · Cursor</text>
<text x="64" y="160" class="s">Aider · Cline · Zed · …</text>
<text x="64" y="192" class="n" fill="#8a8fa0">50,000 tokens</text>

<rect class="mid" x="475" y="50" width="250" height="180" rx="16"/>
<g transform="translate(503 82) scale(0.36)">
  <rect width="100" height="100" rx="22" fill="#f6f7f9" stroke="#cdd1db" stroke-width="3"/>
  <path d="M24 34h52M32 51h36M40 68h20" stroke="#4357dc" stroke-width="8.5" stroke-linecap="round"/>
  <circle cx="72" cy="68" r="5.5" fill="#ffd47d"/>
</g>
<text x="555" y="104" class="h">Sensei</text>
<text x="503" y="146" class="s">compresses JSON, logs,</text>
<text x="503" y="168" class="s">code and disassembly</text>
<text x="503" y="204" class="s pulse" fill="#17794b">● on your machine</text>

<rect class="card" x="910" y="70" width="250" height="140" rx="14"/>
<text x="934" y="112" class="h">The model</text>
<text x="934" y="138" class="s">Anthropic · OpenAI · Gemini</text>
<text x="934" y="160" class="s">or local: Ollama, llama.cpp</text>
<text x="934" y="192" class="n" fill="#8a5a0c">10,000 tokens</text>

<defs>
  <clipPath id="laneL"><rect x="0" y="-4" width="185" height="96"/></clipPath>
  <clipPath id="laneR"><rect x="0" y="-4" width="185" height="96"/></clipPath>
</defs>
<g transform="translate(290 100)"><g clip-path="url(#laneL)"><rect class="pkt in" style="animation-delay:0.00s" x="-120" y="0" width="120" height="10" rx="5"/><rect class="pkt in" style="animation-delay:0.55s" x="-96" y="18" width="96" height="10" rx="5"/><rect class="pkt in" style="animation-delay:1.10s" x="-132" y="36" width="132" height="10" rx="5"/><rect class="pkt in" style="animation-delay:1.65s" x="-84" y="54" width="84" height="10" rx="5"/><rect class="pkt in" style="animation-delay:2.20s" x="-110" y="72" width="110" height="10" rx="5"/></g></g>
<g transform="translate(725 100)"><g clip-path="url(#laneR)"><rect class="pkt out" style="animation-delay:0.35s" x="-34" y="0" width="34" height="10" rx="5"/><rect class="pkt out" style="animation-delay:0.90s" x="-26" y="18" width="26" height="10" rx="5"/><rect class="pkt out" style="animation-delay:1.45s" x="-40" y="36" width="40" height="10" rx="5"/><rect class="pkt out" style="animation-delay:2.00s" x="-22" y="54" width="22" height="10" rx="5"/><rect class="pkt out" style="animation-delay:2.55s" x="-30" y="72" width="30" height="10" rx="5"/></g></g>

<path class="back" d="M1035 222 C 1035 290, 165 290, 165 222"/>
<text x="600" y="296" text-anchor="middle" class="s">the answer comes back unchanged</text>
</svg>
