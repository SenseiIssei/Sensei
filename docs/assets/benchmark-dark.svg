<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">Tokens removed by Sensei, by kind of content</title>
<desc id="d">Build logs 88%, JSON tool output 79%, Search results 69%, Stack traces 55%, Prose 44%, Code 42%. Aggregate 79% fewer tokens, with 100% of required facts retained.</desc>
<style>
  .h { font: 600 20px Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #e8e8e8; }
  .s { font: 400 14px Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #9b9c9e; }
  .lbl { font: 500 15px Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #e8e8e8; }
  .pct { font: 700 15px 'JetBrains Mono', 'Cascadia Mono', ui-monospace, Menlo, Consolas, monospace; fill: #e8e8e8; opacity: 0; animation: show .4s ease forwards; }
  .bar { fill: #7989ec; transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.1s cubic-bezier(.4,0,.2,1) forwards; }
  .big { font: 700 84px Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #ffd47d; letter-spacing: -3px; }
  @keyframes grow { to { transform: scaleX(1); } }
  @keyframes show { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .bar { animation: none; transform: none; }
    .pct { animation: none; opacity: 1; }
  }
</style>
<rect width="1200" height="420" rx="20" fill="#131619"/>
<rect x="0.5" y="0.5" width="1199" height="419" rx="19.5" fill="none" stroke="#2b2d30"/>
