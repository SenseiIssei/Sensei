<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">Sensei</title>
<desc id="d">Your AI coding tools, minus the padding.</desc>
<defs>
  <radialGradient id="glowA" cx="18%" cy="20%" r="60%">
    <stop offset="0" stop-color="#4357dc" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#4357dc" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="88%" cy="95%" r="45%">
    <stop offset="0" stop-color="#ffd47d" stop-opacity="0.042"/>
    <stop offset="1" stop-color="#ffd47d" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  .l { stroke: #4357dc; stroke-width: 15; stroke-linecap: round; }
  .l1 { animation: l1 6s cubic-bezier(.4,0,.2,1) infinite; }
  .l2 { animation: l2 6s cubic-bezier(.4,0,.2,1) infinite; }
  .l3 { animation: l3 6s cubic-bezier(.4,0,.2,1) infinite; }
  .dot { fill: #ffd47d; transform-box: fill-box; transform-origin: center; animation: dot 6s ease-in-out infinite; }
  @keyframes l1 { 0%,12% { d: path("M43 61H137"); } 30%,88% { d: path("M43 61H137"); } 100% { d: path("M43 61H137"); } }
  @keyframes l2 { 0%,12% { d: path("M43 92H137"); } 30%,88% { d: path("M58 92H122"); } 100% { d: path("M43 92H137"); } }
  @keyframes l3 { 0%,12% { d: path("M43 122H137"); } 30%,88% { d: path("M72 122H108"); } 100% { d: path("M43 122H137"); } }
  @keyframes dot { 0%,26% { transform: scale(0); opacity: 0; } 34% { transform: scale(1.25); opacity: 1; } 40%,86% { transform: scale(1); opacity: 1; } 96%,100% { transform: scale(0); opacity: 0; } }
  .name { font: 700 64px Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #161a25; letter-spacing: -1.5px; }
  .tag { font: 400 24px Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #5f6478; }
  .chip { font: 600 14px Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #5f6478; }
  .num { font: 700 20px 'JetBrains Mono', 'Cascadia Mono', ui-monospace, Menlo, Consolas, monospace; }
  .before { fill: #8a8fa0; animation: fadeOut 6s ease infinite; }
  .after { fill: #8a5a0c; animation: fadeIn 6s ease infinite; }
  .strike { stroke: #8a8fa0; stroke-width: 2; animation: strike 6s ease infinite; transform-box: fill-box; transform-origin: left; }
  @keyframes strike { 0%,20% { transform: scaleX(0); } 30%,88% { transform: scaleX(1); } 96%,100% { transform: scaleX(0); } }
  @keyframes fadeIn { 0%,26% { opacity: 0; } 36%,86% { opacity: 1; } 96%,100% { opacity: 0; } }
  @keyframes fadeOut { 0%,24% { opacity: 1; } 32%,88% { opacity: .55; } 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
<rect width="1200" height="340" rx="24" fill="#f6f7f9"/>
<rect width="1200" height="340" rx="24" fill="url(#glowA)"/>
<rect width="1200" height="340" rx="24" fill="url(#glowB)"/>
<rect x="0.5" y="0.5" width="1199" height="339" rx="23.5" fill="none" stroke="#e0e2ea"/>

<g transform="translate(80 80)">
  <rect width="180" height="180" rx="40" fill="#eff1f5" stroke="#cdd1db" stroke-width="2"/>
  <g transform="translate(0 0)">
    <path class="l l1" d="M43 61H137"/>
    <path class="l l2" d="M58 92H122"/>
    <path class="l l3" d="M72 122H108"/>
    <circle class="dot" cx="130" cy="122" r="10"/>
  </g>
</g>

<text x="320" y="150" class="name">Sensei</text>
<text x="322" y="194" class="tag">Your AI coding tools, minus the padding.</text>

<g transform="translate(322 222)">
  <rect width="322" height="44" rx="10" fill="#ffffff" stroke="#e0e2ea"/>
  <text x="18" y="29" class="num before">102,440</text>
  <line x1="16" y1="23" x2="100" y2="23" class="strike"/>
  <text x="116" y="29" class="num" fill="#8a8fa0">→</text>
  <text x="148" y="29" class="num after">63,645 tokens</text>
</g>

<g transform="translate(700 222)">
  <rect width="420" height="44" rx="10" fill="none" stroke="#e0e2ea"/>
  <circle cx="22" cy="22" r="4" fill="#17794b"/>
  <text x="36" y="27" class="chip">Windows · macOS · Linux   ·   MIT   ·   zero telemetry</text>
</g>
</svg>
