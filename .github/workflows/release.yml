name: Release

# Tag-triggered. Builds every distributable Sensei ships, attaches them to a
# GitHub Release with checksums and Sigstore signatures, and pushes container
# images to GHCR.
#
# GHCR needs no setup — it authenticates with the built-in GITHUB_TOKEN.
# PyPI, the VS Code Marketplace and Open VSX are wired up but *gated on their
# secrets existing*, so they are silently skipped until those accounts are
# created. Nothing here fails because an account is missing.
#
# Installers are NOT code-signed (no Apple Developer account / Windows cert
# yet), so macOS shows a Gatekeeper prompt and Windows shows SmartScreen. The
# release notes say so explicitly — see `release-notes` below.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a dry run)"
        required: false

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  # ── The Rust accelerator, as abi3 wheels (one per platform, all Pythons) ──
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: "x86_64"
          - os: ubuntu-24.04-arm
            archs: "aarch64"
          - os: windows-latest
            archs: "AMD64"
          - os: macos-latest
            archs: "arm64 x86_64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        with:
          package-dir: rust/sensei_core
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          # abi3-py311 means one wheel covers every CPython >= 3.11.
          CIBW_BUILD: "cp311-*"
          CIBW_SKIP: "*-musllinux_i686"
          CIBW_BEFORE_ALL_LINUX: "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          # The macOS runner is arm64 and this matrix entry builds both arches.
          # Without the x86_64 target installed, the Intel wheel fails deep in a
          # dependency with `can't find crate for 'core'`, which reads like a
          # broken toolchain rather than a missing cross-compilation target.
          CIBW_BEFORE_ALL_MACOS: "rustup target add x86_64-apple-darwin aarch64-apple-darwin"
          # CPython's own x86_64 wheels are tagged macosx_10_9, but rustc has not
          # targeted anything below 10.12 for years, so delocate rejects the
          # wheel: the tag promises more compatibility than the binary has.
          # 10.12 is rustc's floor, not a preference — raising it would drop
          # machines for nothing, lowering it does not build.
          # arm64 is unaffected: cibuildwheel pins those to 11.0 regardless.
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=10.12"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdists:
    name: sdist + pure-python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The wheel has to carry the web UI. `pip install sensei-gateway` used to
      # ship the API only, so `sensei up` served the Swagger page and printed
      # "the web UI isn't built — cd frontend && npm ci && npm run build" at
      # someone who had installed from PyPI and had no frontend directory. That
      # is the headline install path in the README.
      - name: Build the web UI into the package
        run: |
          cd frontend && npm ci && npm run build && cd ..
          rm -rf backend/sensei/webui
          cp -r frontend/dist backend/sensei/webui

      - run: pip install build
      - name: Build the sensei package
        working-directory: backend
        run: python -m build --sdist --wheel --outdir ../dist-python

      - name: Fail if the wheel does not contain the web UI
        run: |
          set -euo pipefail
          wheel=$(ls dist-python/sensei_gateway-*.whl)
          # A wheel that silently lost its UI is the exact bug this job was
          # changed to fix, and it would look like a successful build.
          if ! python -c "
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sys.exit(0 if any(n.startswith('sensei/webui/') and n.endswith('.html') for n in names) else 1)
          " "$wheel"; then
            echo "::error::$wheel contains no sensei/webui — pip users would get no dashboard"
            exit 1
          fi
          echo "web UI present in $wheel"
      - name: Build the sensei_core sdist
        run: |
          pip install "maturin>=1.9,<2"
          maturin sdist --manifest-path rust/sensei_core/Cargo.toml --out dist-python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dists
          path: dist-python/*

  # ── Native single-file apps. The web UI is built first and bundled in. ──
  installers:
    name: installer (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
          - os: ubuntu-latest
            label: linux-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the web UI (gets bundled into the binary)
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install build deps
        run: |
          pip install pyinstaller
          pip install -e ./backend

      - name: Build the binary
        run: pyinstaller packaging/sensei.spec --noconfirm --distpath dist-app

      # ── Windows: the bare .exe, plus a .zip for Scoop ──
      # Scoop wants an archive it can extract and a sha256 it can pin. Handing
      # it a bare .exe works but gives up the checksum verification, which is
      # the only integrity story an unsigned build has.
      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          cp dist-app/sensei.exe "out/sensei-${{ matrix.label }}.exe"
          (cd dist-app && 7z a -tzip "../out/sensei-${{ matrix.label }}.zip" sensei.exe)

      # ── macOS: a .dmg to double-click, plus a .tar.gz for Homebrew ──
      # `brew` cannot install from a .dmg. A formula pointing at a tarball of
      # the same binary is the difference between "download and drag" and
      # "brew install", and the second is how macOS users actually install.
      - name: Stage macOS artifact
        if: runner.os == 'macOS'
        run: |
          mkdir -p out staging
          cp dist-app/sensei staging/sensei
          chmod +x staging/sensei
          hdiutil create -volname Sensei -srcfolder staging -ov -format ULFO \
            "out/sensei-${{ matrix.label }}.dmg"
          tar -czf "out/sensei-${{ matrix.label }}.tar.gz" -C staging sensei

      # ── Linux: AppImage plus .deb and .rpm ──
      - name: Stage Linux artifacts
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p out

          # AppImage
          mkdir -p AppDir/usr/bin
          cp dist-app/sensei AppDir/usr/bin/sensei
          chmod +x AppDir/usr/bin/sensei
          cp frontend/public/sensei.svg AppDir/sensei.svg
          cat > AppDir/sensei.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Sensei
          Exec=sensei
          Icon=sensei
          Categories=Development;Utility;
          Terminal=true
          EOF
          ln -sf usr/bin/sensei AppDir/AppRun
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir \
            "out/sensei-${{ matrix.label }}.AppImage"

          # Plain tarball as well: Homebrew on Linux, and anyone who wants the
          # binary without AppImage's FUSE requirement.
          mkdir -p staging
          cp dist-app/sensei staging/sensei
          chmod +x staging/sensei
          tar -czf "out/sensei-${{ matrix.label }}.tar.gz" -C staging sensei

          # .deb / .rpm via fpm
          sudo gem install --no-document fpm
          version="${GITHUB_REF_NAME#v}"
          version="${version:-0.0.0}"
          mkdir -p pkgroot/usr/bin
          cp dist-app/sensei pkgroot/usr/bin/sensei
          chmod +x pkgroot/usr/bin/sensei
          for fmt in deb rpm; do
            fpm -s dir -t "$fmt" -n sensei -v "$version" \
              --license MIT \
              --description "Self-hosted AI workspace with token compression" \
              --url "https://github.com/SenseiIssei/Sensei" \
              --maintainer "Sensei Issei" \
              -C pkgroot -p "out/sensei_${version}_amd64.${fmt}" .
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.label }}
          path: out/*

  # ── Multi-arch container images to GHCR (works with zero setup) ──
  containers:
    name: containers -> GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - context: ./backend
            image: sensei-backend
          - context: ./frontend
            image: sensei-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── VS Code extension: always build the .vsix, publish only if tokens exist ──
  extension:
    name: vsix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    # Job-level env, because a step's own `env:` block is not visible to that
    # step's `if:` expression — the gate would always evaluate to empty.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      # `main` is ./dist/extension.js, which esbuild produces. Packaging without
      # compiling first fails with "Extension entrypoint(s) missing", which is
      # what every release attempt did until v0.1.0 — the workflow called vsce
      # directly instead of the package.json script that compiles first.
      # `vscode:prepublish` now covers anyone who runs vsce by hand; this stays
      # explicit so a CI reader can see the build step exists.
      - run: npm run compile
      - run: npx vsce package --no-dependencies --out sensei.vsix
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath sensei.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish sensei.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: extensions/vscode/sensei.vsix

  # ── Collect everything, sign it, publish the GitHub Release ──
  release:
    name: GitHub Release
    needs: [wheels, sdists, installers, containers, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for Sigstore keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Flatten and checksum
        run: |
          mkdir -p release
          # `docker/build-push-action` uploads a `.dockerbuild` build record as
          # an artifact of its own. It is a debugging aid for the build, not
          # something a user should be offered next to the installers, and the
          # v0.1.0 release shipped four of them because this swept up everything
          # it found.
          find artifacts -type f ! -name '*.dockerbuild' -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # Rendered from SHA256SUMS, so the digests in a formula are by
      # construction the digests of the files that were just uploaded.
      - name: Render package-manager manifests
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version:-0.0.0}"
          python scripts/render_manifests.py \
            --version "$version" \
            --sums release/SHA256SUMS \
            --out manifests
          # Attached as one archive rather than loose files: three package
          # managers want three directory layouts, and flattening them into the
          # release would lose the layout each one needs.
          tar -czf "release/package-manager-manifests.tar.gz" -C manifests .

      - name: Sign every artifact with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./release/*
          upload-signing-artifacts: false
      - name: Write the install/verify notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Install

          ```bash
          pipx install sensei-gateway              # any platform, needs Python 3.11+
          brew install senseiissei/tap/sensei      # macOS, Linux
          winget install SenseiIssei.Sensei        # Windows
          scoop install sensei                     # Windows, portable
          ```

          Or take a single file that needs no Python at all:

          | Platform | File |
          |---|---|
          | Windows 10/11 x64 | `sensei-windows-x64.exe` (or `.zip`) |
          | macOS (Apple silicon) | `sensei-macos-arm64.dmg` (or `.tar.gz`) |
          | macOS (Intel) | `sensei-macos-x86_64.dmg` (or `.tar.gz`) |
          | Linux x86_64 | `sensei-linux-x86_64.AppImage`, `.deb`, `.rpm`, `.tar.gz` |
          | Docker | `ghcr.io/senseiissei/sensei-backend:latest` |
          | VS Code | `sensei.vsix` |

          Then:

          ```bash
          sensei up            # start the server, open the web UI
          sensei setup-tools   # point the AI tools on this machine at it
          ```

          ### These builds are not code-signed

          Sensei has no Apple Developer account or Windows code-signing
          certificate yet, so:

          - **macOS** shows *"cannot be opened because the developer cannot be
            verified"*. Right-click the app and choose **Open**, or run
            `xattr -d com.apple.quarantine /path/to/sensei`.
          - **Windows** shows a SmartScreen warning. Click **More info ->
            Run anyway**.

          Verify what you downloaded instead of trusting the warning dialog:

          ```bash
          sha256sum -c SHA256SUMS --ignore-missing
          ```

          Every artifact is also signed with Sigstore. Verify one with:

          ```bash
          pip install sigstore
          sigstore verify identity \
            --cert-identity-regexp 'https://github.com/SenseiIssei/Sensei/.*' \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            sensei-linux-x86_64.AppImage
          ```
          EOF
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release/*
          body_path: release-notes.md
          generate_release_notes: true
          draft: false

  # ── Homebrew tap and Scoop bucket: push the rendered manifest to its repo ──
  #
  # Gated on the token existing, like the marketplace jobs above, so a release
  # in a repo without a tap skips this instead of failing on it. Both target
  # repositories have to exist first — see docs/packaging.md.
  package-managers:
    name: ${{ matrix.manager }}
    needs: [release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager: homebrew
            repo: homebrew-tap
            dir: Formula
            file: sensei.rb
            token_name: TAP_TOKEN
          - manager: scoop
            repo: scoop-bucket
            dir: bucket
            file: sensei.json
            token_name: BUCKET_TOKEN
    env:
      TOKEN: ${{ secrets[matrix.token_name] }}
    steps:
      - name: Fetch the rendered manifests from the release
        if: env.TOKEN != ''
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          curl -fsSL -o manifests.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/package-manager-manifests.tar.gz"
          mkdir -p manifests && tar -xzf manifests.tar.gz -C manifests

      - name: Check out the target repository
        if: env.TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ env.TOKEN }}
          path: target

      - name: Commit the updated manifest
        if: env.TOKEN != ''
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "target/${{ matrix.dir }}"
          cp "manifests/${{ matrix.manager }}/${{ matrix.file }}" \
             "target/${{ matrix.dir }}/${{ matrix.file }}"
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Nothing to do when a re-run produces a byte-identical manifest.
          if git diff --quiet; then
            echo "manifest already current"
            exit 0
          fi
          git add "${{ matrix.dir }}/${{ matrix.file }}"
          git commit -m "sensei ${version}"
          git push

  # ── PyPI: only runs once the project exists and Trusted Publishing is set up ──
  pypi:
    name: PyPI (skipped until configured)
    needs: [wheels, sdists]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing — no API token is ever stored
    # Guarded by a repository variable so a fork or an unconfigured repo never
    # fails the release. Set PYPI_ENABLED=true in repo variables to turn on.
    if: vars.PYPI_ENABLED == 'true'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{wheels-*,python-dists}"
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
