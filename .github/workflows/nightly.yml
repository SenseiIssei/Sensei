name: Nightly

# Every number in the README comes from backend/benchmarks/results/*.json. Those
# numbers are only trustworthy if something re-measures them every day against
# the actual code and fails when the code no longer earns them.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    # Any change to the compression pipeline must prove it didn't regress.
    paths:
      - "backend/sensei/compression/**"
      - "backend/benchmarks/**"
      - "rust/sensei_core/**"
      # The README table and graphics must match the results they claim.
      - "README.md"
      - "docs/assets/**"

permissions:
  contents: read

jobs:
  benchmark:
    name: compression benchmark (${{ matrix.accelerator && 'rust' || 'python' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        accelerator: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: matrix.accelerator
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.accelerator
        with:
          workspaces: rust/sensei_core

      - name: Install
        run: pip install -e ./backend

      - name: Install the Rust accelerator
        if: matrix.accelerator
        run: |
          pip install "maturin>=1.9,<2"
          maturin build --release --out wheels --manifest-path rust/sensei_core/Cargo.toml
          pip install wheels/*.whl

      # The six-sample micro corpus: not a claim about anybody's bill any more,
      # but a cheap guard that the compressors still do what they did.
      - name: Run the micro benchmark with a regression floor
        working-directory: backend
        run: |
          python benchmarks/compression_benchmark.py \
            --json ../benchmark-${{ matrix.accelerator && 'rust' || 'python' }}.json \
            --min-aggregate 75

      # The seeded agent corpus, against the committed results the README is
      # drawn from. Fails when savings drop by more than a point, when a fact
      # that used to survive is lost, or when a file read stops being
      # byte-exact. A PR that improves compression re-runs `benchmarks.refresh`
      # and commits the new results, and this then holds the improvement.
      - name: Check the agent corpus against the committed results
        working-directory: backend
        run: |
          python -m benchmarks.agent_bench \
            --check benchmarks/results/agent_corpus.json --max-drop 1 --repeats 3 \
            --out ../agent-${{ matrix.accelerator && 'rust' || 'python' }}.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ matrix.accelerator && 'rust' || 'python' }}
          path: |
            benchmark-*.json
            agent-*.json
          retention-days: 90

  # Shrinking text and preserving meaning are different claims, and until this
  # job existed only the first one was checked anywhere. This is the checkable
  # half of the second: every fact an agent would need out of a payload must
  # still be literally present after compression.
  #
  # The floor is 100 and that is deliberate. Unlike the savings percentage,
  # which moves with the tokenizer and the corpus, a lost fact is never jitter —
  # it is always a defect. The first run of this eval found two: a regex that
  # meant `File "` but said `File ", "`, so no traceback frame was ever kept,
  # and build output being classified as prose.
  quality:
    name: fact retention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ./backend
      - name: Check that compression preserves the facts
        working-directory: backend
        run: |
          python benchmarks/quality_eval.py \
            --json ../quality.json \
            --min-retention 100
      # A regression here means the stripper stopped stripping, which shows up
      # as a quietly larger bill rather than as a failure — the payload still
      # works, it just costs more. The floor is well under the measured 17% so
      # it catches that without failing on corpus jitter.
      - name: Check that invisible characters are still being removed
        working-directory: backend
        run: python benchmarks/invisible_benchmark.py --min-overhead 10
      # Nobody types a benchmark number into the README: it is rendered from the
      # results files, and this fails if README.md or an SVG has drifted from them.
      - name: README table and graphics match the committed results
        working-directory: backend
        run: python -m benchmarks.refresh --check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality
          path: quality.json
          retention-days: 90

  # Rust and Python must agree exactly, or the "optional accelerator" claim is
  # a lie. Compare the two benchmark payloads token-for-token.
  parity:
    name: rust/python result parity
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
          merge-multiple: true
      - name: Compare
        run: |
          python - <<'PY'
          import json, pathlib, sys

          py = json.loads(pathlib.Path("results/benchmark-python.json").read_text())
          rs = json.loads(pathlib.Path("results/benchmark-rust.json").read_text())

          if py["samples"] != rs["samples"]:
              print("::error::Rust accelerator output differs from the Python path")
              for a, b in zip(py["samples"], rs["samples"]):
                  if a != b:
                      print(f"  {a['name']}: python={a} rust={b}")
              sys.exit(1)
          print(f"Byte-parity confirmed. Aggregate: {py['aggregate']['saved_pct']}%")

          # Same for the agent corpus: token counts per sample must agree.
          ap = pathlib.Path("results/agent-python.json")
          ar = pathlib.Path("results/agent-rust.json")
          if ap.exists() and ar.exists():
              a = {r["name"]: r["sensei"]["tokens"] for r in json.loads(ap.read_text())["samples"]}
              b = {r["name"]: r["sensei"]["tokens"] for r in json.loads(ar.read_text())["samples"]}
              diff = sorted(k for k in a if a[k] != b.get(k))
              if diff:
                  print("::error::Rust and Python disagree on the agent corpus:", ", ".join(diff))
                  sys.exit(1)
              print("Agent corpus parity confirmed.")
          PY

  # Publish the numbers instead of asserting them.
  #
  # A benchmark that only ever runs in CI and fails a build is a private
  # guarantee; the README makes a public claim. Appending each run to a file on
  # `gh-pages` turns "79%" into something a reader can check, and turns a slow
  # regression — the kind that stays above the floor for months — into a visible
  # slope rather than a number nobody compares to last quarter's.
  publish-trend:
    name: publish the benchmark trend
    needs: [benchmark, quality]
    # Not on pull requests: a PR must not be able to write to the published
    # history, and a fork could not authenticate for it anyway.
    if: github.event_name != 'pull_request' && github.repository == 'SenseiIssei/Sensei'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
          merge-multiple: true

      - name: Append this run to the history
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess

          def load(name):
              path = pathlib.Path("results") / name
              return json.loads(path.read_text()) if path.exists() else None

          py = load("benchmark-python.json")
          rs = load("benchmark-rust.json")
          agent = load("agent-python.json")
          quality = load("quality.json")
          if py is None:
              raise SystemExit("benchmark-python.json missing — nothing to publish")

          date = subprocess.run(
              ["git", "log", "-1", "--format=%cs"], capture_output=True, text=True, check=True
          ).stdout.strip()

          row = {
              "date": date,
              "commit": os.environ["GITHUB_SHA"],
              "run": os.environ["GITHUB_RUN_ID"],
              "saved_pct": py["aggregate"]["saved_pct"],
              "rust_saved_pct": rs["aggregate"]["saved_pct"] if rs else None,
              "retention_pct": quality["aggregate"]["retention_pct"] if quality else None,
              "metric": py.get("metric"),
          }
          if agent:
              s = agent["summary"]["sensei"]
              row.update({
                  "agent_saved_pct": s["agent"]["saved_pct"],
                  "agent_facts_kept": s["all"]["facts_kept"],
                  "agent_facts_total": s["all"]["facts_total"],
                  "headroom_scenarios_saved_pct": s["headroom_scenarios"]["total"]["saved_pct"],
                  "latency_p95_ms": s["all"]["latency_ms"]["p95"],
                  "corpus_digest": agent["corpus"]["digest"][:12],
              })
          pathlib.Path("row.json").write_text(json.dumps(row))
          print(json.dumps(row, indent=2))
          PY

      - name: Commit it to gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Orphan branch on first run; the history is data, not source, and
          # sharing main's history would double the clone size for no reason.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add pages origin/gh-pages
          else
            git worktree add --detach pages
            (cd pages && git checkout --orphan gh-pages && git rm -rfq --cached . || true)
            find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

          cp docs/benchmark-page/index.html pages/index.html
          cat row.json >> pages/history.jsonl
          echo "" >> pages/history.jsonl
          # Blank lines would accumulate on re-runs; the page skips them, but a
          # data file that grows empty lines is a data file nobody trusts.
          grep -v '^$' pages/history.jsonl > pages/history.tmp
          mv pages/history.tmp pages/history.jsonl

          cd pages
          git add index.html history.jsonl
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "benchmark: $(date -u +%Y-%m-%d)"
          # The worktree is a detached HEAD (both branches above), so push the
          # commit by ref rather than by a local branch name that may not exist.
          git push origin HEAD:gh-pages

  # Headroom on the same corpus, the same way the committed head-to-head was
  # measured. Informational: Headroom's numbers are not ours to gate on, and a
  # new Headroom release must not fail Sensei's nightly. It lives in a throwaway
  # venv and never becomes a dependency of this repository.
  headroom:
    name: head-to-head with Headroom (informational)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ./backend
      - name: Install Headroom out of tree
        working-directory: backend
        env:
          SENSEI_BENCH_HOME: ${{ runner.temp }}/sensei-bench
        run: python -m benchmarks.headroom_env
      - name: Run both on the agent corpus
        working-directory: backend
        env:
          SENSEI_BENCH_HOME: ${{ runner.temp }}/sensei-bench
        run: python -m benchmarks.agent_bench --headroom --repeats 3 --out ../headroom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headroom
          path: headroom.json
          retention-days: 90

  # Dependencies move even when we don't. Catch breakage from upstream releases
  # here, at 3am, instead of in someone's PR.
  latest-deps:
    name: tests against the newest dependencies
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - working-directory: backend
        run: |
          pip install -e ".[dev]" --upgrade --upgrade-strategy eager
          pip list
          pytest -q
