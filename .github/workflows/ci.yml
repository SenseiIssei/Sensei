name: CI

# The merge gate. Everything here must be green before anything reaches main.
# Actions are pinned to commit SHAs (with the human-readable tag in a comment)
# so a compromised or retagged action can't silently change what runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  # ── Lint runs once and fast; it fails the PR before the matrix spends money ──
  lint-backend:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install ruff
        working-directory: backend
        run: pip install "ruff>=0.16.0"
      - run: ruff check --output-format=github .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      - name: Config reference matches the Settings model
        # docs/configuration.md is generated from pydantic. Drift here means
        # someone added a setting nobody can find out about.
        run: |
          pip install -e ./backend
          python scripts/gen_config_docs.py --check

  backend:
    name: backend (${{ matrix.os }}, py${{ matrix.python }})
    needs: lint-backend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # The mcp extra is installed so the MCP server tests actually run rather
      # than silently skipping via importorskip.
      - run: pip install -e ".[dev,mcp]"
      - name: Run tests
        run: pytest -q --cov=sensei --cov-report=xml --cov-report=term-missing
      # One representative job uploads coverage; nine would just be noise.
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: The web UI must not fetch anything from a third party
        if: matrix.os == 'ubuntu-latest'
        # Sensei claims to work offline and to leak nothing about you. A stray
        # CDN font or analytics tag silently breaks both, so it is checked.
        run: npm run check:offline
      - name: The web UI must survive being mounted under /app/
        if: matrix.os == 'ubuntu-latest'
        # `sensei up` serves it there. Root-absolute asset URLs render a blank
        # page with an empty console — this shipped once already.
        run: npm run check:subpath
      - name: Enforce the JS bundle budget
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Guard against a dependency quietly doubling first-load cost.
          budget_kb=450
          total=$(find dist/assets -name '*.js' -exec cat {} + | wc -c)
          total_kb=$(( total / 1024 ))
          echo "JS bundle total: ${total_kb} kB (budget ${budget_kb} kB)"
          if [ "$total_kb" -gt "$budget_kb" ]; then
            echo "::error::JS bundle is ${total_kb} kB, over the ${budget_kb} kB budget"
            exit 1
          fi

  extension:
    name: vscode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - run: npm run compile
      - name: Verify the extension packages
        run: npx vsce package --no-dependencies --out /tmp/sensei.vsix

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust/sensei_core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust/sensei_core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release

  # The accelerator must produce byte-identical output to the pure-Python path.
  # Building the wheel and re-running the full suite against it is the only
  # honest way to prove that.
  rust-parity:
    name: rust/python byte parity
    needs: [backend, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust/sensei_core
      - name: Build and install the accelerator
        run: |
          pip install "maturin>=1.9,<2"
          maturin build --release --out dist --manifest-path rust/sensei_core/Cargo.toml
          pip install dist/*.whl
      - name: Run the suite with the Rust path active
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          python -c "import sensei_core; print('accelerator active:', sensei_core.__file__)"
          pytest -q

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          load: true
          tags: sensei-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test /health
        run: |
          docker run -d --name sensei -p 7000:7000 sensei-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7000/health; then
              echo "healthy"; docker rm -f sensei; exit 0
            fi
            sleep 2
          done
          echo "::error::container never became healthy"
          docker logs sensei
          exit 1
      - name: Build the frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          load: true
          tags: sensei-frontend:ci

  # The one-command installers, run for real against a published release on
  # every OS: download, SHA256SUMS check, install, and the binary answering.
  # Plus the Windows installer script compiled with dummy binaries, because the
  # release workflow only compiles it on a tag — too late to find a typo.
  installers:
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      SENSEI_VERSION: "0.1.19"
      SENSEI_AUTOSTART: "no"
      SENSEI_SETUP_TOOLS: "no"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install.sh (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sh -n install.sh
          if command -v shellcheck >/dev/null; then shellcheck -s sh install.sh; fi
          SENSEI_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/sensei" --version
      - name: install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          & "$env:LOCALAPPDATA\Programs\Sensei\sensei.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Compile the Windows installer script
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install innosetup --no-progress -y > /dev/null
          mkdir -p dist-app
          printf 'MZ' > dist-app/sensei.exe
          printf 'MZ' > dist-app/senseiw.exe
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //Qp //DAppVersion=0.0.0 packaging/sensei.iss

  # A single required check to point branch protection at, so adding a matrix
  # entry later doesn't mean reconfiguring the protection rule.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint-backend, backend, frontend, extension, rust, rust-parity, e2e, docker, installers]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
